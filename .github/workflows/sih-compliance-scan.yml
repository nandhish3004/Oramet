name: SIH Zero-Tolerance & Code Compliance Scan

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  compliance-audit:
    name: Code Quality and Plagiarism Pre-Screen
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository source code
      - name: Checkout Codebase
        uses: actions/checkout@v4

      # 2. Set up the environment (Python example - adjust to your tech stack)
      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install required static analysis and security tools
      - name: Install Linting & Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit flake8 safety

      # 4. Scan for security issues (e.g., hidden terminal commands or risky web calls)
      - name: Run Security Analysis (Bandit)
        run: |
          # Bandit scans for security vulnerabilities and dangerous execution paths
          bandit -r . -x ./tests -ll

      # 5. Enforce Code Standards & Dead/Unused Code Removal
      - name: Run Style & Unused Import Checks (Flake8)
        run: |
          # F401 catches unused imports; F841 catches unused local variables
          # Fails the build if unauthorized playground artifacts or imports are left behind
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # 6. Verify Third-Party Dependency Vulnerabilities
      - name: Audit Package Dependencies (Safety)
        run: |
          # Verifies that requirements.txt does not contain known insecure or unapproved modules
          if [ -f requirements.txt ]; then safety check -r requirements.txt; fi

      # 7. Check for Prohibited Snippets & Easter Eggs
      - name: Custom Keyword & Easter Egg Ban Policy
        run: |
          echo "Scanning for prohibited system flags or easter eggs..."
          # Case-insensitive check to ensure 'import antigravity' hasn't leaked into Python scripts
          if grep -ri "import antigravity" --include="*.py" .; then
            echo "::error::CRITICAL FAULT DETECTED: 'import antigravity' found in code. Rejecting build to prevent SIH compliance failure."
            exit 1
          fi
          echo "Compliance baseline verified successfully."

      # 8. Set up Node.js Environment (OraMet React Native Tech Stack)
      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 9. Install Node Dependencies
      - name: Install Node Dependencies
        run: |
          npm ci --prefer-offline --no-audit

      # 10. Verify TypeScript Type Safety & 0 Compilation Errors
      - name: TypeScript Zero-Error Compile Check
        run: |
          npx tsc --noEmit

      # 11. Enforce Zero-Emoji Compliance across Source Code
      - name: Audit Zero-Emoji Policy
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const emojiRegex = /[\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F000}-\u{1F02F}\u{1F0A0}-\u{1F0FF}\u{1F100}-\u{1F64F}\u{1F680}-\u{1F6FF}]/u;
          
          function walk(dir) {
            let found = [];
            const list = fs.readdirSync(dir);
            list.forEach(file => {
              const fullPath = path.join(dir, file);
              const stat = fs.statSync(fullPath);
              if (stat && stat.isDirectory()) {
                found = found.concat(walk(fullPath));
              } else if (file.endsWith('.ts') || file.endsWith('.tsx')) {
                const content = fs.readFileSync(fullPath, 'utf8');
                const lines = content.split('\n');
                lines.forEach((line, idx) => {
                  if (emojiRegex.test(line)) {
                    found.push({ file: fullPath, line: idx + 1, text: line.trim() });
                  }
                });
              }
            });
            return found;
          }
          
          const issues = walk('./src');
          if (issues.length > 0) {
            console.error('::error::Emoji compliance violation detected:', JSON.stringify(issues, null, 2));
            process.exit(1);
          } else {
            console.log('Zero-emoji compliance verified across all source files.');
          }
          "
