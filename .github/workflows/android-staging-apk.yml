name: Android staging APK

on:
  push:
    branches:
      - arena/01a0e1d7-oramet
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build-staging-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            'platform-tools' \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            'ndk;26.1.10909125'

      - name: Install JavaScript dependencies
        run: npm ci --no-audit

      - name: Verify TypeScript, lint, and tests
        run: |
          npx tsc --noEmit
          npm run lint
          npm test -- --runInBand

      - name: Build bundled demo APK
        id: build_apk
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleStaging --stacktrace --no-daemon 2>&1 | tee "$RUNNER_TEMP/oramet-gradle-build.log"

      - name: Add build diagnostics to the job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/oramet-gradle-build.log" ]; then
            echo '### Android staging build output (last 100 lines)' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 "$RUNNER_TEMP/oramet-gradle-build.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload staging APK and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oramet-staging-apk
          path: |
            android/app/build/outputs/apk/staging/app-staging.apk
            ${{ runner.temp }}/oramet-gradle-build.log
          if-no-files-found: warn
          retention-days: 14
