name: Android staging APK

on:
  push:
    branches:
      - arena/01a0e1d7-oramet
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build-staging-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            'platform-tools' \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            'ndk;26.1.10909125'

      - name: Install JavaScript dependencies
        run: npm ci --no-audit

      - name: Verify TypeScript, lint, and tests
        run: |
          npx tsc --noEmit
          npm run lint
          npm test -- --runInBand

      - name: Build bundled demo APK
        run: npm run build:apk

      - name: Upload staging APK
        uses: actions/upload-artifact@v4
        with:
          name: oramet-staging-apk
          path: android/app/build/outputs/apk/staging/app-staging.apk
          if-no-files-found: error
          retention-days: 14
